<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salianji Rent Car | Makina me Qira</title>
<meta name="description" content="Salianji Rent Car - makina me qira dhe rezervime online.">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;background:#080808;color:#fff}header{background:#111;padding:18px 6%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;border-bottom:1px solid #333}.logo{font-size:21px;font-weight:700;color:#d4af37}nav a{color:#fff;text-decoration:none;margin-left:18px}.hero{min-height:430px;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 20px;background:linear-gradient(#000b,#000b),url("https://images.unsplash.com/photo-1504215680853-026ed2a45def?auto=format&fit=crop&w=1600&q=80") center/cover}.hero h1{font-size:45px;margin-bottom:15px}.gold{color:#d4af37}.hero p{font-size:18px;color:#ddd;margin-bottom:25px}.btn{display:inline-block;background:#d4af37;color:#000;padding:13px 24px;border:0;border-radius:7px;text-decoration:none;font-weight:700;cursor:pointer}.btn:disabled{opacity:.45;cursor:not-allowed}section{padding:55px 6%}.title{text-align:center;margin-bottom:30px}.title h2{font-size:32px;color:#d4af37;margin-bottom:8px}.cars{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:25px;max-width:1200px;margin:auto}.car{background:#171717;border-radius:14px;overflow:hidden;border:1px solid #292929}.car img{width:100%;height:210px;object-fit:cover}.content{padding:20px}.content h3{font-size:24px;margin-bottom:8px}.info{color:#aaa;margin-bottom:12px}.price{color:#d4af37;font-size:22px;font-weight:700;margin-bottom:12px}.ok{color:#55d66b;margin-bottom:14px}.no{color:#ff5555;margin-bottom:14px}.desc{color:#aaa;line-height:1.5;margin-bottom:15px}.booking{max-width:650px;margin:auto;background:#171717;padding:25px;border-radius:14px}.booking input,.booking select{width:100%;padding:14px;margin-bottom:14px;border-radius:7px;border:1px solid #444;background:#0d0d0d;color:#fff;font-size:16px}.booking .btn{width:100%;font-size:17px}.msg{text-align:center;margin-top:15px}.loading{text-align:center;color:#aaa;padding:30px}footer{background:#111;text-align:center;padding:30px;color:#999}@media(max-width:600px){.hero h1{font-size:34px}nav{display:none}section{padding:40px 5%}}
</style>
</head>
<body>
<header><div class="logo">SALIANJI RENT CAR</div><nav><a href="#cars">Makinat</a><a href="#booking">Rezervo</a></nav></header>

<section class="hero">
<div><h1>Salianji <span class="gold">Rent Car</span></h1><p>Makina me qira • Komoditet • Siguri</p><a href="#cars" class="btn">Shiko makinat</a></div>
</section>

<section id="cars">
<div class="title"><h2>Makinat tona</h2><p>Zgjidh makinën që dëshiron</p></div>
<div id="carsList" class="cars"><div class="loading">Duke ngarkuar makinat...</div></div>
</section>

<section id="booking">
<div class="title"><h2>Rezervo makinën</h2><p>Plotëso të dhënat dhe do t'ju kontaktojmë.</p></div>
<div class="booking">
<select id="carSelect"><option value="">Zgjidh makinën</option></select>
<input id="customerName" type="text" placeholder="Emri dhe mbiemri">
<input id="phone" type="tel" placeholder="Numri i telefonit">
<input id="email" type="email" placeholder="Email (opsionale)">
<input id="startDate" type="date">
<input id="endDate" type="date">
<button class="btn" onclick="makeBooking()">Dërgo rezervimin</button>
<div id="message" class="msg"></div>
</div>
</section>

<footer><p>© 2026 Salianji Rent Car</p><p>Makina me qira</p></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://zbcklxnrvfqdmxplfncw.supabase.co";
const SUPABASE_KEY="VENDOS_PUBLISHABLE_KEY_KETU";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let cars=[];

async function loadCars(){
 const {data,error}=await supabaseClient.from("cars").select("*").order("id");
 if(error){console.error(error);document.getElementById("carsList").innerHTML="<div class='loading'>Nuk u ngarkuan makinat. Kontrollo Supabase/RLS.</div>";return}
 cars=data||[];displayCars();fillCarSelect();
}
function displayCars(){
 const list=document.getElementById("carsList");
 if(!cars.length){list.innerHTML="<div class='loading'>Nuk ka makina të regjistruara.</div>";return}
 list.innerHTML=cars.map(car=>`
 <article class="car">
  <img src="${car.image_url||'https://via.placeholder.com/800x500?text=Salianji+Rent+Car'}" alt="${escapeHtml(car.name)}">
  <div class="content">
   <h3>${escapeHtml(car.name)}</h3>
   <div class="info">${escapeHtml(car.brand||"")} ${car.year?"• "+car.year:""}</div>
   <div class="price">€${car.price_per_day||0} / ditë</div>
   <div class="${car.available?'ok':'no'}">${car.available?'● E lirë':'● E rezervuar'}</div>
   <p class="desc">${escapeHtml(car.description||"")}</p>
   <button class="btn" onclick="selectCar(${car.id})" ${car.available?"":"disabled"}>Rezervo</button>
  </div>
 </article>`).join("");
}
function fillCarSelect(){
 const select=document.getElementById("carSelect");
 cars.filter(c=>c.available).forEach(car=>{
  const o=document.createElement("option");o.value=car.id;o.textContent=`${car.name} - €${car.price_per_day}/ditë`;select.appendChild(o);
 });
}
function selectCar(id){document.getElementById("carSelect").value=id;document.getElementById("booking").scrollIntoView({behavior:"smooth"});}
async function makeBooking(){
 const carId=document.getElementById("carSelect").value;
 const customerName=document.getElementById("customerName").value.trim();
 const phone=document.getElementById("phone").value.trim();
 const email=document.getElementById("email").value.trim();
 const startDate=document.getElementById("startDate").value;
 const endDate=document.getElementById("endDate").value;
 const message=document.getElementById("message");
 if(!carId||!customerName||!phone||!startDate||!endDate){message.style.color="#ff5555";message.textContent="Plotëso fushat e nevojshme.";return}
 if(new Date(endDate)<new Date(startDate)){message.style.color="#ff5555";message.textContent="Data e kthimit duhet të jetë pas datës së marrjes.";return}
 message.style.color="#d4af37";message.textContent="Duke dërguar rezervimin...";
 const {error}=await supabaseClient.from("bookings").insert([{car_id:Number(carId),customer_name:customerName,phone,email:email||null,start_date:startDate,end_date:endDate,status:"pending"}]);
 if(error){console.error(error);message.style.color="#ff5555";message.textContent="Rezervimi nuk u dërgua. Kontrollo RLS në Supabase.";return}
 message.style.color="#55d66b";message.textContent="Rezervimi u dërgua me sukses! Do t'ju kontaktojmë së shpejti.";
 ["customerName","phone","email","startDate","endDate"].forEach(id=>document.getElementById(id).value="");
}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));}
loadCars();
</script>
</body>
</html>
