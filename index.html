<div id="bookingModal" class="modal">
  <div class="box">

    <div class="modalhead">
      <h2>🚗 Rezervo makinën</h2>
      <button class="close" onclick="closeModal('bookingModal')">×</button>
    </div>

    <div style="
      background:#211d0d;
      border:1px solid #8d7424;
      padding:12px;
      border-radius:8px;
      color:#e0bd4f;
      margin-bottom:18px;
    ">
      📌 Rezervimi duhet të bëhet të paktën
      <b>3 ditë përpara</b>.
    </div>

    <div class="formgrid">

      <!-- MAKINA -->
      <div class="formfield full">
        <label>🚗 Makina</label>
        <select id="bookingCar"></select>
      </div>

      <!-- EMRI -->
      <div class="formfield">
        <label>👤 Emri dhe Mbiemri</label>
        <input
          id="customerName"
          type="text"
          placeholder="Emri dhe mbiemri">
      </div>

      <!-- TELEFON -->
      <div class="formfield">
        <label>📞 Telefon</label>
        <input
          id="customerPhone"
          type="tel"
          placeholder="+355 69...">
      </div>

      <!-- EMAIL -->
      <div class="formfield">
        <label>✉️ Email</label>
        <input
          id="customerEmail"
          type="email"
          placeholder="email@example.com">
      </div>

      <!-- VENDNDODHJA -->
      <div class="formfield">
        <label>📍 Vendndodhja e marrjes</label>

        <select id="pickup">
          <option value="Tiranë">Tiranë</option>
          <option value="Aeroporti i Rinasit">
            Aeroporti i Rinasit
          </option>
          <option value="Durrës">Durrës</option>
          <option value="Fier">Fier</option>
        </select>
      </div>

      <!-- DATA MARRJES -->
      <div class="formfield">
        <label>📅 Data dhe ora e marrjes</label>
        <input
          id="bookingStart"
          type="datetime-local">
      </div>

      <!-- DATA KTHIMIT -->
      <div class="formfield">
        <label>📅 Data dhe ora e kthimit</label>
        <input
          id="bookingEnd"
          type="datetime-local">
      </div>

      <!-- KILOMETRAT -->
      <div class="formfield">
        <label>🛣️ Kilometrat e parashikuara në ditë</label>

        <input
          id="dailyKm"
          type="number"
          min="0"
          value="300"
          placeholder="300">
      </div>

      <!-- OPSIONE -->
      <div class="formfield full">

        <label style="
          color:#e0bd4f;
          font-size:15px;
          margin-bottom:8px;
        ">
          ➕ Opsione shtesë
        </label>

        <div style="
          display:grid;
          gap:10px;
        ">

          <!-- SHOFER SHTESË -->
          <label style="
            display:flex;
            align-items:center;
            gap:10px;
            background:#101a24;
            border:1px solid #293641;
            padding:13px;
            border-radius:9px;
            cursor:pointer;
          ">

            <input
              id="extraDriver"
              type="checkbox"
              style="accent-color:#c9a227;">

            <span>
              👨‍✈️ Shofer shtesë
              <b style="color:#e0bd4f;">
                +€10
              </b>
            </span>

          </label>

          <!-- SEDILJE BEBE -->
          <label style="
            display:flex;
            align-items:center;
            gap:10px;
            background:#101a24;
            border:1px solid #293641;
            padding:13px;
            border-radius:9px;
            cursor:pointer;
          ">

            <input
              id="babySeat"
              type="checkbox"
              style="accent-color:#c9a227;">

            <span>
              👶 Sedilje bebe / child seat
              <b style="color:#e0bd4f;">
                +€10
              </b>
            </span>

          </label>

          <!-- JASHTË SHQIPËRISË -->
          <label style="
            display:flex;
            align-items:center;
            gap:10px;
            background:#101a24;
            border:1px solid #293641;
            padding:13px;
            border-radius:9px;
            cursor:pointer;
          ">

            <input
              id="outsideAlbania"
              type="checkbox"
              style="accent-color:#c9a227;">

            <span>
              🌍 Dalje jashtë kufirit shqiptar
              <b style="color:#e0bd4f;">
                +€40 / ditë
              </b>
            </span>

          </label>

          <!-- MBI 300 KM -->
          <div style="
            background:#101a24;
            border:1px solid #293641;
            padding:13px;
            border-radius:9px;
          ">

            🛣️ Mbi 300 km në ditë

            <b style="color:#e0bd4f;">
              +€30 / ditë
            </b>

            <div style="
              color:#89939d;
              font-size:12px;
              margin-top:5px;
            ">
              Nëse vendos më shumë se 300 km/ditë,
              aplikohet tarifa +€30/ditë.
            </div>

          </div>

        </div>

      </div>

      <!-- SHËNIME -->
      <div class="formfield full">

        <label>📝 Shënime</label>

        <textarea
          id="bookingNotes"
          placeholder="Shënime shtesë..."></textarea>

      </div>

      <!-- PËRMBLEDHJA -->
      <div class="formfield full">

        <div style="
          background:#080f16;
          border:1px solid #c9a227;
          border-radius:10px;
          padding:15px;
        ">

          <h3 style="
            color:#e0bd4f;
            margin-bottom:12px;
          ">
            💰 Përmbledhja e rezervimit
          </h3>

          <div
            id="bookingSummary"
            style="
              color:#cdd3d8;
              line-height:1.8;
            ">
          </div>

          <div style="
            border-top:1px solid #293641;
            margin-top:10px;
            padding-top:12px;
            display:flex;
            justify-content:space-between;
            font-size:20px;
          ">

            <b>TOTALI</b>

            <strong
              id="bookingTotal"
              style="color:#e0bd4f;">
              €0
            </strong>

          </div>

        </div>

      </div>

    </div>

    <div class="modalactions">

      <button
        class="btn"
        onclick="closeModal('bookingModal')">
        Mbyll
      </button>

      <button
        class="goldbtn"
        onclick="submitBooking()">
        ✅ Konfirmo Rezervimin
      </button>

    </div>

  </div>
</div>
